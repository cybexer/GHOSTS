name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes

  server-bundle:
    name: Upload server bundle
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package server bundle
        run: |
          mkdir -p "$RUNNER_TEMP/server-bundle"
          git archive --format=tar \
            --prefix="ghosts-server-${{ github.ref_name }}/" \
            "${{ github.ref_name }}" \
            .dockerignore \
            docker-compose.server.yml \
            src/Dockerfile-api \
            src/Ghosts.Api \
            ':(exclude)src/Ghosts.Api/config/SeedData' \
            ':(exclude)src/Ghosts.Api/.env.example' \
            src/Ghosts.Domain \
            src/Ghosts.Animator \
            src/Ghosts.Frontend \
            schemas/scenario-document/v1 \
            schemas/scenario-document/corpus \
            configuration/grafana \
            | tar -xf - -C "$RUNNER_TEMP/server-bundle"
          appsettings="$RUNNER_TEMP/server-bundle/ghosts-server-${{ github.ref_name }}/src/Ghosts.Api/appsettings.json"
          jq 'del(.ConnectionStrings.DefaultConnection, .InitSettings.AdminPassword, .TerrainProvider.Token)' "$appsettings" > "$appsettings.tmp"
          mv "$appsettings.tmp" "$appsettings"
          (cd "$RUNNER_TEMP/server-bundle" && zip -qr "$GITHUB_WORKSPACE/ghosts-server-${{ github.ref_name }}.zip" "ghosts-server-${{ github.ref_name }}")

      - name: Upload server bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "ghosts-server-${{ github.ref_name }}.zip"
