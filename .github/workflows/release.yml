name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes

  server-bundle:
    name: Upload server bundle
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package server bundle
        run: |
          git archive --format=zip \
            --prefix="ghosts-server-${{ github.ref_name }}/" \
            -o "ghosts-server-${{ github.ref_name }}.zip" \
            "${{ github.ref_name }}" \
            docker-compose.server.yml \
            src/Ghosts.Frontend \
            configuration/grafana

      - name: Upload server bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "ghosts-server-${{ github.ref_name }}.zip"
