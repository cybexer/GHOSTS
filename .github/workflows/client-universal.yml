name: Client Universal

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/Ghosts.Client.Universal/**'
      - 'src/Ghosts.Domain/**'
      - '.github/workflows/client-universal.yml'
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to
        required: true
        default: CRPv9.3.0

permissions:
  contents: read

jobs:
  build:
    name: Build Universal Client
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Ghosts.Client.Universal/Ghosts.Client.Universal.csproj --configuration Release

  release:
    name: Publish ${{ matrix.runtime }}
    if: github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        runtime: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish src/Ghosts.Client.Universal/Ghosts.Client.Universal.csproj \
            -c Release -r ${{ matrix.runtime }} --self-contained false \
            -o publish/${{ matrix.runtime }}

      - name: Package
        run: zip -r ghosts-client-universal-${{ matrix.runtime }}.zip publish/${{ matrix.runtime }}/

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          for attempt in {1..30}; do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep 2
          done
          gh release upload "$tag" ghosts-client-universal-${{ matrix.runtime }}.zip
