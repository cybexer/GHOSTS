name: Client Universal

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/Ghosts.Client.Universal/**'
      - 'src/Ghosts.Client.Universal.Tests/**'
      - 'src/Ghosts.Domain/**'
      - '.github/workflows/client-universal.yml'
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Test
        run: dotnet test src/Ghosts.Client.Universal.Tests/Ghosts.Client.Universal.Tests.csproj --configuration Release

  build:
    name: Build ${{ matrix.runtime }}
    if: github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            framework: net11.0
          - runtime: win-x64
            framework: net11.0-windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Publish
        run: |
          dotnet publish src/Ghosts.Client.Universal/Ghosts.Client.Universal.csproj \
            -c Release -f ${{ matrix.framework }} -r ${{ matrix.runtime }} --self-contained false \
            -o publish/${{ matrix.runtime }}

      - name: Package
        run: zip -r ghost-client-universal-${{ matrix.runtime }}.zip publish/${{ matrix.runtime }}/

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          for attempt in {1..30}; do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep 2
          done
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Release $tag" --generate-notes
          gh release upload "$tag" ghost-client-universal-${{ matrix.runtime }}.zip
